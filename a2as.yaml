agents:
  availability_checker_agent:
    type: instance
    models: [gemini-2.0-flash]
    tools: [check_attendees_availability, get_team_members]
    params:
      name: availability_checker
      description: Checks calendar availability for meeting attendees and resolves team names to individual emails
      instruction: strip()
  event_creator_agent:
    type: instance
    models: [gemini-2.0-flash]
    tools: [create_event, validate_emails]
    params:
      name: event_creator
      description: Creates calendar events after validation, ensuring all details are correct
      instruction: strip()
  event_validator_agent:
    type: instance
    models: [gemini-2.0-flash]
    tools: [check_policies, check_conflict]
    params:
      name: event_validator
      description: Validates events against organizational policies and checks for calendar conflicts
      instruction: strip()
  facility_manager_agent:
    type: instance
    models: [gemini-2.0-flash]
    tools: [find_facility, get_facility_info]
    params:
      name: facility_manager
      description: Manages meeting room and facility booking based on requirements
  root_agent:
    type: instance
    models: [gemini-2.5-flash]
    tools: [search_tool_instance, validate_emails, check_conflict, create_event, get_team_members, get_user_details, find_facility,
      get_facility_info, load_memory, preload_memory]
    params:
      name: calendar_coordinator
      description: Coordinates calendar scheduling by delegating to specialized sub-agents, with mandatory location collection
        and smart holiday checking.
      instruction: strip()
      after_agent_callback: auto_save_session_to_memory
      sub_agents: [availability_checker_agent, facility_manager_agent, event_validator_agent, event_creator_agent]

models:
  gemini-2.0-flash:
    type: literal
    agents: [event_validator_agent, facility_manager_agent, event_creator_agent, availability_checker_agent]
  gemini-2.5-flash:
    type: literal
    agents: [root_agent]

tools:
  check_attendees_availability:
    type: function
    agents: [availability_checker_agent]
    params:
      description: |-
        Check if attendees are available during the specified time slot using Google Calendar FreeBusy API.
        Also checks working hours and holidays preferences.

        Args:
            attendees: Comma-separated email addresses
            date: Date string (DD-MM-YYYY or YYYY-MM-DD)
            start_time: Start time "11:15"
            end_time: End time "13:15" OR duration like "2hr"
            organizer_tz: Timezone name (e.g., 'Asia/Singapore'). If None, uses system timezone

        Returns:
            Dictionary with availability information:
            {
                "all_free": bool,
                "busy_attendees": {"email@example.com": [{"start": "...", "end": "..."}], ...},
                "free_attendees": ["email@example.com", ...],
                "start": iso_string,
                "end": iso_string
            }
  check_conflict:
    type: function
    agents: [event_validator_agent, root_agent]
    params:
      description: |-
        Checks overlapping events across ALL user calendars using UTC timezone.

        Args:
            date: Date string (DD-MM-YYYY or YYYY-MM-DD)
            start_time: Start time "11:15"
            end_time: End time "13:15" OR duration "2hr"
            timezone: Timezone name (e.g., 'Asia/Singapore'). If None, uses system timezone.

        Returns:
            Dictionary with conflict status and event details
  check_policies:
    type: function
    agents: [event_validator_agent]
    params:
      description: |-
        Check event against organizational policies.

        Args:
            duration_hours: Meeting duration in hours
            attendee_count: Number of attendees
            start_hour: Start hour (0-23)
            day_of_week: Day name (e.g., "Monday", "Saturday")

        Returns:
            {
                "allowed": bool,
                "violations": [...],
                "warnings": [...]
            }
  create_event:
    type: function
    agents: [event_creator_agent, root_agent]
    params:
      description: |-
        Creates event with timezone-aware times in UTC.

        Args:
            title: Event title
            date: Date string (DD-MM-YYYY or YYYY-MM-DD)
            start_time: Start time "11:15"
            end_time: End time "13:15" OR duration like "2hr"
            attendees: Comma-separated email addresses (optional)
            calendar_name: Name of the calendar to create event on (default: "primary")

        Returns:
            Dictionary with event details including UTC timestamps
  find_facility:
    type: function
    agents: [facility_manager_agent, root_agent]
    params:
      description: Finds facilities matching minimum capacity and containing ALL specified amenities.
  get_facility_info:
    type: function
    agents: [facility_manager_agent, root_agent]
    params:
      description: Returns details for a specific facility by name.
  get_team_members:
    type: function
    agents: [root_agent, availability_checker_agent]
    params:
      description: |-
        Returns a list of email addresses for members of the specified team.
        Case-insensitive match on team name.
  get_user_details:
    type: function
    agents: [root_agent]
    params:
      description: |-
        Returns full details for a specific user by email or username.
        Case-insensitive match.
  load_memory:
    type: function
    agents: [root_agent]
  preload_memory:
    type: function
    agents: [root_agent]
  search_tool_instance:
    type: function
    agents: [root_agent]
  validate_emails:
    type: function
    agents: [event_creator_agent, root_agent]
    params:
      description: |-
        Validates a list of email addresses.

        Checks for:
        1. Syntax and deliverability (DNS check)
        2. Disposable email domains
        3. Common domain typos (e.g. gmai.com -> gmail.com)

        Args:
            emails: List of email address strings.

        Returns:
            Dictionary with:
            - "valid": List of valid email strings.
            - "invalid": List of dictionaries with "email" and "reason".
            - "typo_suggestions": List of dictionaries with "original", "suggestion".

teams:
