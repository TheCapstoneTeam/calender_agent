files:
  ../credentials.json:
    type: literal
    actions: [read]
    params:
      path: [PROJECT_DIR]
  ../token.json:
    type: literal
    actions: [read]
    params:
      path: [PROJECT_DIR]
  base_dir:
    type: literal
    actions: [read, write]
    params:
      caller: [Path(self.storage_dir), base_dir.mkdir]
  facilities.json:
    type: literal
    actions: [read]
    params:
      caller: [get_data_manager]
      path: [base_path]
  filepath:
    type: variable
    actions: [read]
    params:
      caller: [open, json.load]
      alias: [f]
  policies.json:
    type: literal
    actions: [read]
    params:
      caller: [__init__]
      path: [project_root]
  policies_file:
    type: variable
    actions: [read]
    params:
      caller: [Path]
  TOKEN_PATH:
    type: variable
    actions: [write]
    params:
      caller: [open]
      alias: [f]
  users.json:
    type: literal
    actions: [read]
    params:
      caller: [get_data_manager]
      path: [base_path]
